<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="omGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <linearGradient id="omGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="omBlur">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sacred Radiance Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#omGlow)" opacity="0.25" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#omGold)" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- The Auspicious OM (ॐ) Character -->
  <text x="100" y="132" 
        font-family="'Cinzel', 'Noto Sans Devanagari', 'Segoe UI', serif" 
        font-size="110" 
        font-weight="900" 
        fill="url(#omGold)" 
        text-anchor="middle"
        filter="url(#omBlur)">
    ॐ
  </text>
</svg>
