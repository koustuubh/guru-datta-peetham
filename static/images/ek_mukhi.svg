<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="ekRudra" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="silverMount" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="140" fill="#fffbeb"/>

  <!-- Half-Moon / Cashew Shaped 1-Mukhi Rudraksha -->
  <g transform="translate(150, 135)">
    <!-- Crescent Body of Ek Mukhi -->
    <path d="M -55,-25 C -20,-60 40,-50 65,-10 C 80,15 70,45 40,55 C 10,65 -30,55 -55,30 C -70,12 -70,-5 -55,-25 Z" 
          fill="url(#ekRudra)" stroke="#451a03" stroke-width="2"/>
    
    <!-- Single Sacred Deep Furrow (The Single Mukhi Cleft) -->
    <path d="M -45,-15 C -15,-40 30,-30 50,-5" fill="none" stroke="#260e02" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Natural Textured Ridges -->
    <path d="M -30,10 C -10,35 25,35 45,15" fill="none" stroke="#451a03" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M -40,30 C -20,48 10,48 30,35" fill="none" stroke="#451a03" stroke-width="1.5"/>

    <!-- Pure Silver Floral Mount & Capping -->
    <!-- Top Cap -->
    <path d="M-22,-45 Q-10,-55 5,-45 L-8,-62 Z" fill="url(#silverMount)"/>
    <circle cx="-8" cy="-66" r="6" fill="none" stroke="url(#silverMount)" stroke-width="3"/>
    
    <!-- Bottom Cap -->
    <path d="M-15,46 Q0,56 20,46 L2,60 Z" fill="url(#silverMount)"/>

    <!-- Red Silk Thread -->
    <line x1="-80" y1="-66" x2="65" y2="-66" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="255" width="220" height="28" rx="14" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="274" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    1-MUKHI SHIVA RUDRAKSHA
  </text>
</svg>
