<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="gauriRudra" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="silverWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="140" fill="#fff7ed"/>

  <!-- Two Naturally Joined Rudrakshas (Shiva & Shakti) -->
  <g transform="translate(150, 135)">
    <!-- Left Bead (Shiva) -->
    <ellipse cx="-24" cy="0" rx="34" ry="44" fill="url(#gauriRudra)"/>
    <path d="M-45,-20 Q-24,-44 -3,-20" stroke="#451a03" stroke-width="2.5" fill="none"/>
    <path d="M-45,0 Q-24,-20 -3,0" stroke="#451a03" stroke-width="2.5" fill="none"/>
    <path d="M-45,20 Q-24,44 -3,20" stroke="#451a03" stroke-width="2.5" fill="none"/>

    <!-- Right Bead (Parvati/Gauri) -->
    <ellipse cx="24" cy="0" rx="34" ry="44" fill="url(#gauriRudra)"/>
    <path d="M3,-20 Q24,-44 45,-20" stroke="#451a03" stroke-width="2.5" fill="none"/>
    <path d="M3,0 Q24,-20 45,0" stroke="#451a03" stroke-width="2.5" fill="none"/>
    <path d="M3,20 Q24,44 45,20" stroke="#451a03" stroke-width="2.5" fill="none"/>

    <!-- Conjoining Joint Line -->
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#451a03" stroke-width="4"/>

    <!-- Pure Silver Snake / Capping Wire -->
    <path d="M-20,-48 L20,-48 L0,-65 Z" fill="url(#silverWire)"/>
    <circle cx="0" cy="-68" r="8" fill="none" stroke="url(#silverWire)" stroke-width="3"/>
    <circle cx="0" cy="-68" r="4" fill="url(#silverWire)"/>

    <path d="M-20,48 L20,48 L0,65 Z" fill="url(#silverWire)"/>
    <circle cx="0" cy="68" r="5" fill="url(#silverWire)"/>

    <!-- Sacred Red Silk Cord through loop -->
    <path d="M -80,-68 L 80,-68" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="255" width="220" height="28" rx="14" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="274" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="1">
    GAURI SHANKAR RUDRAKSHA
  </text>
</svg>
