<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="rudraWood" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="140" fill="#fffbeb"/>

  <!-- Rudraksha Beads in Arc -->
  <g transform="translate(150, 140)">
    <!-- Circumference thread -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#dc2626" stroke-width="2.5"/>

    <!-- Distinct Mukhi Ridges on Beads -->
    <g transform="translate(0, -92)"><circle cx="0" cy="0" r="14" fill="url(#rudraWood)"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#451a03" stroke-width="1.5"/><line x1="0" y1="-10" x2="0" y2="10" stroke="#451a03" stroke-width="1.5"/></g>
    <g transform="translate(28, -87)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(54, -74)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(75, -53)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(88, -27)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(92, 0)"><circle cx="0" cy="0" r="14" fill="url(#rudraWood)"/></g>
    <g transform="translate(88, 27)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(75, 53)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(54, 74)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(28, 87)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>

    <g transform="translate(-28, -87)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-54, -74)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-75, -53)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-88, -27)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-92, 0)"><circle cx="0" cy="0" r="14" fill="url(#rudraWood)"/></g>
    <g transform="translate(-88, 27)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-75, 53)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-54, 74)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>
    <g transform="translate(-28, 87)"><circle cx="0" cy="0" r="13" fill="url(#rudraWood)"/></g>

    <!-- Large Guru Rudraksha with Gold Capping -->
    <circle cx="0" cy="95" r="18" fill="url(#rudraWood)"/>
    <path d="M-15,86 Q0,76 15,86 Z" fill="url(#goldCap)"/>
    <path d="M-15,104 Q0,114 15,104 Z" fill="url(#goldCap)"/>
    <!-- Five Mukhi Lines -->
    <line x1="-12" y1="95" x2="12" y2="95" stroke="#451a03" stroke-width="2"/>
    <line x1="0" y1="83" x2="0" y2="107" stroke="#451a03" stroke-width="2"/>

    <!-- Tassel -->
    <polygon points="-8,114 8,114 0,124" fill="url(#goldCap)"/>
    <path d="M -8,124 L -11,154 Q 0,158 11,154 L 8,124 Z" fill="#dc2626"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="260" width="200" height="26" rx="13" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="150" y="278" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle" letter-spacing="1">
    5-MUKHI NEPALI MALA
  </text>
</svg>
